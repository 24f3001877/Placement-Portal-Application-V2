<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RecruitRadar — Placement Portal</title>

  <!-- Bootstrap 5 CSS (CDN) — only allowed CSS framework -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <!-- Bootstrap Icons -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    rel="stylesheet"
  />
  <!-- Chart.js (optional milestone — analytics charts) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>

  <style>
    :root {
      --rr-primary:   #1d4ed8;
      --rr-secondary: #0f172a;
      --rr-accent:    #f59e0b;
      --rr-success:   #16a34a;
      --rr-danger:    #dc2626;
      --rr-light-bg:  #f8fafc;
    }
    body {
      background-color: var(--rr-light-bg);
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    .rr-navbar { background-color: var(--rr-secondary) !important; }
    .rr-navbar .navbar-brand { color: var(--rr-accent) !important; font-weight: 700; letter-spacing: 0.5px; }
    .rr-navbar .nav-link { color: #cbd5e1 !important; }
    .rr-navbar .nav-link:hover, .rr-navbar .nav-link.active { color: #fff !important; }
    .rr-card { border: none; border-radius: 10px; box-shadow: 0 2px 12px rgba(0,0,0,0.07); }
    .rr-stat-card { border-left: 4px solid var(--rr-primary); }
    .rr-badge-pending    { background-color: #fbbf24; color: #1c1917; }
    .rr-badge-approved   { background-color: #16a34a; color: #fff; }
    .rr-badge-rejected   { background-color: #dc2626; color: #fff; }
    .rr-badge-closed     { background-color: #64748b; color: #fff; }
    .rr-badge-applied    { background-color: #3b82f6; color: #fff; }
    .rr-badge-shortlisted{ background-color: #8b5cf6; color: #fff; }
    .rr-badge-interview  { background-color: #f59e0b; color: #1c1917; }
    .rr-badge-offer      { background-color: #06b6d4; color: #fff; }
    .rr-badge-placed     { background-color: #16a34a; color: #fff; }
    .badge[class*="rr-badge"] { font-size: 0.78rem; padding: 4px 10px; border-radius: 20px; }
    .page-enter-active, .page-leave-active { transition: opacity 0.18s ease; }
    .page-enter-from, .page-leave-to { opacity: 0; }
  </style>
</head>
<body>
  <div id="app"></div>

  <script src="https://cdn.jsdelivr.net/npm/vue@3.4.27/dist/vue.global.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vue-router@4.3.3/dist/vue-router.global.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.2/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script src="/static/src/store.js"></script>
  <script src="/static/src/api.js"></script>
  <script src="/static/src/components/AlertMsg.js"></script>
  <script src="/static/src/components/NavBar.js"></script>
  <script src="/static/src/pages/LandingPage.js"></script>
  <script src="/static/src/pages/LoginPage.js"></script>
  <script src="/static/src/pages/AdminDashboard.js"></script>
  <script src="/static/src/pages/AdminCompanies.js"></script>
  <script src="/static/src/pages/AdminStudents.js"></script>
  <script src="/static/src/pages/AdminDrives.js"></script>
  <script src="/static/src/pages/CompanyDashboard.js"></script>
  <script src="/static/src/pages/CompanyDrives.js"></script>
  <script src="/static/src/pages/CompanyApplications.js"></script>
  <script src="/static/src/pages/StudentDashboard.js"></script>
  <script src="/static/src/pages/StudentProfile.js"></script>
  <script src="/static/src/pages/StudentHistory.js"></script>
  <script src="/static/src/pages/StudentATS.js"></script>
  <script src="/static/src/router.js"></script>
  <script src="/static/src/main.js"></script>
</body>
</html>
